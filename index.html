<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختار بحثك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --off-white:#F7F5EE;
    --paper:#FFFFFF;
    --navy:#152A4D;
    --navy-deep:#0D1D38;
    --ink:#171717;
    --green:#1E7145;
    --green-bg:#E8F5EC;
    --red:#B23B3B;
    --red-bg:#FBEAEA;
    --amber:#B9791C;
    --amber-bg:#FBF1DE;
    --line:#DFDACB;
    --muted:#6B6559;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--off-white);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.headline{font-family:'Cairo',sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* topbar */
  .topbar{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30;}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Cairo',sans-serif;font-weight:800;color:var(--navy);font-size:20px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none;}
  .nav-actions{display:flex;gap:10px;align-items:center;}
  .btn{border:none;border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;transition:transform .08s ease, opacity .15s ease;}
  .btn:active{transform:scale(.97);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-navy:hover{background:var(--navy-deep);}
  .btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-outline:hover{background:var(--navy);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-red{background:var(--red);color:#fff;}
  .btn-red:hover{opacity:.9;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:24px;}
  .section{padding:40px 0;}
  .muted{color:var(--muted);}

  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}

<script>
/* =========================================================
   اختار بحثك — تطبيق صفحة واحدة (Front-end فقط، تخزين محلي)
   ========================================================= */

/* ---------- تخزين محلي (بديل قاعدة البيانات في هذا الملف الواحد) ---------- */
const DB_KEY = 'ekhtar_bahsak_db_v1';

function defaultDB(){
  return {
    requests: [],            // كل طلبات الطلاب
    similarityDecisions: {},  // key: "idA|idB" -> {decision:'not_similar', by, at}
    reviewLog: [],            // سجل التعديلات العام
    similarityReviewedAt: null,
    similarityReviewedBy: null,
    resetLog: []
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) { const d = defaultDB(); saveDB(d); return d; }
    return JSON.parse(raw);
  }catch(e){ const d = defaultDB(); saveDB(d); return d; }
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let DB = loadDB();

/* بيانات الدخول — ملاحظة: هذا ملف HTML مستقل بدون خادم حقيقي، لذلك أي بيانات
   موجودة هنا يمكن قراءتها من كود الصفحة. لتأمين حقيقي يلزم خادم/Supabase فعلي. */
const LEADER_AUTH = { code:'Leader@gis.2027', password:'Gis@leader' };
const ADMIN_AUTH  = { code:'mo@nour.gis', password:'mohamed@nour.leader' };

const SESSION_KEY = 'ekhtar_bahsak_session';
function getSession(){ try{return JSON.parse(sessionStorage.getItem(SESSION_KEY))||null;}catch(e){return null;} }
function setSession(role){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({role, at:Date.now()})); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
function isLeader(){ const s=getSession(); return s && (s.role==='leader'||s.role==='admin'); }
function isAdmin(){ const s=getSession(); return s && s.role==='admin'; }

/* حماية محاولات الدخول المتكررة */
function loginAttemptsKey(who){ return 'attempts_'+who; }
function getAttempts(who){ try{return JSON.parse(sessionStorage.getItem(loginAttemptsKey(who)))||{count:0, lockUntil:0};}catch(e){return {count:0,lockUntil:0};} }
function setAttempts(who,val){ sessionStorage.setItem(loginAttemptsKey(who), JSON.stringify(val)); }

/* ---------- أدوات مساعدة ---------- */
function uid(){ return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function generateUniqueCode(){
  const existing = new Set(DB.requests.map(r=>r.code));
  let code;
  do{ code = String(Math.floor(1000+Math.random()*9000)); }while(existing.has(code));
  return code;
}

function nowIso(){ return new Date().toISOString(); }

function fmtCairo(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    return d.toLocaleString('ar-EG', { timeZone:'Africa/Cairo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
  }catch(e){ return iso; }
}
function fmtDateOnly(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ar-EG',{timeZone:'Africa/Cairo'});
}
function fmtTimeOnly(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('ar-EG',{timeZone:'Africa/Cairo', hour12:true});
}

function maskPhone(p){
  if(!p||p.length<6) return p;
  return p.slice(0,3)+'••••'+p.slice(-2);
}

function toast(msg, type='info'){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- التحقق من صحة المدخلات ---------- */
function validateName(name){
  const parts = name.trim().split(/\s+/).filter(Boolean);
  return parts.length >= 4;
}
function validatePhone(phone){
  const p = phone.trim().replace(/\s|-/g,'');
  // يقبل 01xxxxxxxxx (11 رقم) أو برمز الدولة 20/+20/0020 متبوعاً بـ 1xxxxxxxxx
  return /^01[0-9]{9}$/.test(p) || /^(\+20|0020|20)1[0-9]{9}$/.test(p);
}
function normalizePhone(phone){
  let p = phone.trim().replace(/\s|-/g,'');
  p = p.replace(/^(\+20|0020|20)/, '0');
  return p;
}
function onlyDigits(str){ return /^[0-9]+$/.test(str); }

/* ---------- منع التكرار حسب رقم الهاتف ---------- */
function activeRequestForPhone(phone){
  return DB.requests.find(r => r.phone===phone && (r.status==='pending' || r.status==='accepted'));
}
function historyForPhone(phone){
  return DB.requests.filter(r=>r.phone===phone).sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
}

/* ---------- محرك اكتشاف التشابه (تحليل محلي تقديري — ليس نموذج ذكاء اصطناعي فعلي) ---------- */
const STOPWORDS = new Set(['في','من','على','إلى','عن','و','ال','هذا','هذه','ذلك','التي','الذي','مع','أو','ثم','قد','كل','بين','حول','نحو','عند','لكل','إن','أن','كان','يتم','دراسة','بحث','عن','باستخدام','لل']);
const CONCEPT_BUCKETS = [
  {key:'gis', words:['نظم المعلومات الجغرافية','نظام معلومات جغرافي','جي آي إس','gis','geographic information']},
  {key:'rs', words:['استشعار عن بعد','الاستشعار عن بعد','remote sensing','أقمار صناعية','صور فضائية']},
  {key:'survey', words:['مساحة','المساحة','الجيوديسيا','جيوديسيا','surveying','geodesy']},
  {key:'map', words:['خريطة','خرائط','mapping','map','رسم خرائط']},
  {key:'urban', words:['تخطيط عمراني','التخطيط العمراني','urban planning','مدن ذكية']},
  {key:'env', words:['بيئي','البيئة','environmental','تغير مناخي','مناخ']},
  {key:'water', words:['مياه','موارد مائية','water resources','ري']},
  {key:'agri', words:['زراعي','زراعة','agriculture','محاصيل']},
];

function normalizeArabic(text){
  return (text||'')
    .replace(/[\u064B-\u0652]/g,'') // تشكيل
    .replace(/[إأآا]/g,'ا')
    .replace(/ى/g,'ي')
    .replace(/ة/g,'ه')
    .replace(/[^\u0600-\u06FFa-zA-Z0-9\s]/g,' ')
    .toLowerCase()
    .trim();
}
function tokenize(text){
  const norm = normalizeArabic(text);
  return norm.split(/\s+/).filter(w=>w && !STOPWORDS.has(w) && w.length>1)
    .map(w => w.startsWith('ال') && w.length>4 ? w.slice(2) : w);
}
function conceptTokens(text){
  const norm = normalizeArabic(text);
  const found = new Set();
  CONCEPT_BUCKETS.forEach(b=>{
    b.words.forEach(w=>{ if(norm.includes(normalizeArabic(w))) found.add(b.key); });
  });
  return found;
}
function jaccard(setA, setB){
  const a = new Set(setA), b = new Set(setB);
  if(a.size===0 && b.size===0) return 0;
  let inter=0; a.forEach(x=>{ if(b.has(x)) inter++; });
  const union = new Set([...a, ...b]).size;
  return union===0?0:inter/union;
}
function titleSimilarity(titleA, titleB){
  const tokA = tokenize(titleA), tokB = tokenize(titleB);
  const base = jaccard(tokA, tokB);
  const cA = conceptTokens(titleA), cB = conceptTokens(titleB);
  const conceptOverlap = jaccard(cA, cB);
  // دمج: تشابه الكلمات + وزن إضافي لتشابه المفاهيم التخصصية
  let score = base*0.7 + conceptOverlap*0.3;
  return Math.round(score*100)/100;
}
function pairKey(idA, idB){ return [idA, idB].sort().join('|'); }

function runSimilarityAnalysis(){
  const pending = DB.requests.filter(r=>true); // نقارن كل الطلبات النشطة (غير المرفوضة) لتفادي تكرار مستقبلي أيضاً
  const candidates = DB.requests.filter(r=> r.status!=='rejected');
  const pairs = [];
  for(let i=0;i<candidates.length;i++){
    for(let j=i+1;j<candidates.length;j++){
      const a=candidates[i], b=candidates[j];
      const score = titleSimilarity(a.title, b.title);
      if(score >= 0.28){
        pairs.push({a:a.id, b:b.id, score});
      }
    }
  }
  return pairs;
}

/* تجميع الأزواج المتشابهة في مجموعات (Union-Find) مع استبعاد الأزواج المرفوض تشابهها من الليدر */
function clusterSimilarPairs(pairs){
  const activePairs = pairs.filter(p => {
    const dec = DB.similarityDecisions[pairKey(p.a,p.b)];
    return !(dec && dec.decision==='not_similar');
  });
  const parent = {};
  function find(x){ if(parent[x]===undefined) parent[x]=x; if(parent[x]!==x) parent[x]=find(parent[x]); return parent[x]; }
  function union(x,y){ const rx=find(x), ry=find(y); if(rx!==ry) parent[rx]=ry; }
  activePairs.forEach(p=>{ union(p.a,p.b); });
  const groups = {};
  activePairs.forEach(p=>{
    [p.a,p.b].forEach(id=>{
      const root = find(id);
      groups[root] = groups[root] || new Set();
      groups[root].add(id);
    });
  });
  return {groups: Object.values(groups).map(s=>[...s]), activePairs};
}

/* ---------- منطق الطلبات ---------- */
function addRequest({name, group, phone, title}){
  const req = {
    id: uid(),
    code: generateUniqueCode(),
    name: name.trim(),
    group: group,
    phone: phone,
    title: title.trim(),
    status: 'pending', // pending | accepted | rejected
    createdAt: nowIso(),
    reviewedAt: null,
    rejectionReason: null,
    history: [{action:'تقديم الطلب', oldStatus:null, newStatus:'pending', by:'الطالب', at: nowIso(), note:''}]
  };
  DB.requests.push(req);
  saveDB(DB);
  return req;
}

function logAction(req, action, oldStatus, newStatus, by, note=''){
  req.history = req.history || [];
  req.history.push({action, oldStatus, newStatus, by, at: nowIso(), note});
  DB.reviewLog.push({requestId:req.id, action, oldStatus, newStatus, by, at: nowIso(), note});
}

function setStatus(reqId, newStatus, by, note=''){
  const req = DB.requests.find(r=>r.id===reqId);
  if(!req) return;
  const old = req.status;
  req.status = newStatus;
  req.reviewedAt = nowIso();
  if(newStatus==='rejected') req.rejectionReason = note || req.rejectionReason || 'غير محدد';
  if(newStatus==='accepted') req.rejectionReason = null;
  logAction(req, 'تغيير الحالة', old, newStatus, by, note);
  saveDB(DB);
}

/* ---------- التوجيه (Router) ---------- */
let VIEW = 'home';
let VIEW_PARAMS = {};
function go(view, params={}){
  VIEW = view; VIEW_PARAMS = params;
  window.scrollTo({top:0, behavior:'instant'});
  render();
}

/* ---------- عرض شريط الأزرار العلوي ---------- */
function renderNavActions(){
  const nav = document.getElementById('navActions');
  let html = '';
  if(VIEW!=='home'){
    html += `<button class="btn btn-ghost btn-sm" onclick="go('home')">↩ الرئيسية</button>`;
  }
  if(isAdmin()){
    html += `<span class="badge badge-navy" style="background:#EAF0FB;color:var(--navy);">محمد نور</span>`;
    html += `<button class="btn btn-outline btn-sm" onclick="doLogout()">تسجيل الخروج</button>`;
  } else if(isLeader()){
    html += `<span class="badge badge-gray">الليدر</span>`;
    html += `<button class="btn btn-outline btn-sm" onclick="doLogout()">تسجيل الخروج</button>`;
  }
  nav.innerHTML = html;
}
function doLogout(){ clearSession(); toast('تم تسجيل الخروج', 'info'); go('home'); }

/* ---------- الصفحة الرئيسية ---------- */
function viewHome(){
  return `

      <div class="muted" style="font-size:13.5px;">من إعداد محمد نور</div>
    </div>

    <div class="card" style="margin-bottom:26px;display:flex;gap:16px;align-items:flex-start;">
      <div style="font-size:26px;">💡</div>
      <div style="line-height:2;font-size:15px;">
        أهلاً وسهلاً بيكم يا شباب، ده موقع بسيط عشان تختار منه البحث بتاعك وميكونش مكرر مع حد تاني.
        كل اللي مطلوب منك وانت بتسجل تكتب اسمك رباعي صح ورقم مجموعتك ورقم تليفونك اللي عليه الواتساب
        وعنوان البحث اللي هتكتب عنه.
      </div>
    </div>

    <div class="grid2" style="margin-bottom:30px;">

function markInvalid(fieldId, invalid){
  const el = document.getElementById(fieldId);
  if(!el) return;
  el.classList.toggle('invalid', invalid);
}

function submitNewRequest(e){
  e.preventDefault();
  const name = document.getElementById('in_name').value.trim();
  const groupSel = document.getElementById('in_group');
  const groupHidden = document.getElementById('in_group_hidden');
  const group = groupHidden ? groupHidden.value : (groupSel ? groupSel.value : '');
  const phoneRaw = document.getElementById('in_phone').value.trim();
  const title = document.getElementById('in_title').value.trim();

  let valid = true;
  if(!validateName(name)){ markInvalid('f_name', true); valid=false; } else markInvalid('f_name', false);
  if(!group){ markInvalid('f_group', true); valid=false; } else markInvalid('f_group', false);
  if(!validatePhone(phoneRaw)){ markInvalid('f_phone', true); valid=false; } else markInvalid('f_phone', false);
  if(title.split(/\s+/).filter(Boolean).length < 3){ markInvalid('f_title', true); valid=false; } else markInvalid('f_title', false);

  if(!valid){ toast('توجد بيانات ناقصة أو غير صحيحة', 'error'); return false; }

  const phone = normalizePhone(phoneRaw);
  const active = activeRequestForPhone(phone);
  if(active){
    toast('لديك طلب مسجل بالفعل، يمكنك متابعة حالة طلبك من صفحة متابعة الطلب.', 'warn');
    go('track');
    return false;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = 'جارِ الإرسال...<span class="spinner"></span>';

  setTimeout(()=>{
    const req = addRequest({name, group, phone, title});
    go('success', {code:req.code});
    toast('تم تقديم الطلب بنجاح', 'success');
  }, 350);
  return false;
}

function trackByCode(){
  const code = document.getElementById('in_code').value.trim();
  if(!/^[0-9]{4}$/.test(code)){ markInvalid('f_code', true); return; }
  markInvalid('f_code', false);
  const req = DB.requests.find(r=>r.code===code);
  const box = document.getElementById('trackResult');
  if(!req){ toast('كود المتابعة غير صحيح', 'error'); box.innerHTML=''; return; }
  box.innerHTML = renderRequestResult(req);
}
function trackByPhone(){
  const raw = document.getElementById('in_tphone').value.trim();
  if(!validatePhone(raw)){ markInvalid('f_tphone', true); return; }
  markInvalid('f_tphone', false);
  const phone = normalizePhone(raw);
  const list = historyForPhone(phone);
  const box = document.getElementById('trackResult');
  if(list.length===0){ toast('لا يوجد طلبات مرتبطة بهذا الرقم', 'error'); box.innerHTML=''; return; }
  box.innerHTML = list.map(renderRequestResult).join('<div style="height:14px;"></div>');
}

/* ---------- لوحة تحكم الليدر ---------- */
let dashTab = 'all';
let dashSearch = '';
let dashSort = 'date_asc';

function guardLeader(){
  if(!isLeader()){ toast('لازم تسجل دخول كليدر الأول', 'error'); go('leaderLogin'); return false; }
  return true;
}
function guardAdmin(){
  if(!isAdmin()){ toast('هذه الصفحة خاصة بمحمد نور فقط', 'error'); go('home'); return false; }
  return true;
}

function computeStats(){
  const all = DB.requests;
  const pairs = runSimilarityAnalysis();
  const {groups} = clusterSimilarPairs(pairs);
  const similarCount = new Set(groups.flat()).size;
  return {
    total: all.length,
    pending: all.filter(r=>r.status==='pending').length,
    accepted: all.filter(r=>r.status==='accepted').length,
    rejected: all.filter(r=>r.status==='rejected').length,
    similar: similarCount
  };
}

function viewLeaderDashboard(){
  if(!guardLeader()) return '';
  const stats = computeStats();
  let list = [...DB.requests];
  if(dashTab==='pending') list = list.filter(r=>r.status==='pending');
  if(dashTab==='rejected') list = list.filter(r=>r.status==='rejected');
  if(dashTab==='accepted') list = list.filter(r=>r.status==='accepted');
  if(dashSearch.trim()){
    const q = dashSearch.trim().toLowerCase();
    list = list.filter(r => r.name.toLowerCase().includes(q) || r.title.toLowerCase().includes(q) || r.phone.includes(q));
  }
  list.sort((a,b)=>{
    if(dashSort==='date_asc') return new Date(a.createdAt)-new Date(b.createdAt);
    if(dashSort==='date_desc') return new Date(b.createdAt)-new Date(a.createdAt);
    if(dashSort==='status') return a.status.localeCompare(b.status);
    return 0;
  });

  return `
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h2 class="headline" style="color:var(--navy);margin:0;">لوحة تحكم الليدر</h2>
      <button class="btn btn-outline btn-sm" onclick="go('similarityView')">🧩 فلترة الطلبات المتشابهة</button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0;" id="statsRow">
      ${statCard(stats.total,'إجمالي الطلبات')}
      ${statCard(stats.pending,'قيد المراجعة')}
      ${statCard(stats.accepted,'مقبولة')}
      ${statCard(stats.rejected,'مرفوضة')}
      ${statCard(stats.similar,'أبحاث متشابهة')}
    </div>
    <style>@media(max-width:840px){#statsRow{grid-template-columns:repeat(2,1fr) !important;}}</style>

    <div class="tabs">
      <div class="tab ${dashTab==='all'?'active':''}" style="cursor:pointer" onclick="dashTab='all';render()">جميع الطلبات</div>
      <div class="tab ${dashTab==='pending'?'active':''}" style="cursor:pointer" onclick="dashTab='pending';render()">لم تتم مراجعتها</div>
      <div class="tab ${dashTab==='accepted'?'active':''}" style="cursor:pointer" onclick="dashTab='accepted';render()">المقبولة</div>
      <div class="tab ${dashTab==='rejected'?'active':''}" style="cursor:pointer" onclick="dashTab='rejected';render()">المرفوضة</div>
    </div>

    <div class="card" style="margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
      <input type="text" placeholder="بحث بالاسم أو العنوان أو الهاتف..." value="${esc(dashSearch)}" style="flex:1;min-width:220px;" oninput="dashSearch=this.value;renderTableOnly()">
      <select onchange="dashSort=this.value;render()" style="max-width:220px;">
        <option value="date_asc" ${dashSort==='date_asc'?'selected':''}>الأقدم أولاً</option>
        <option value="date_desc" ${dashSort==='date_desc'?'selected':''}>الأحدث أولاً</option>
        <option value="status">حسب الحالة</option>
      </select>
    </div>

    <div id="tableHolder">${renderRequestsTable(list)}</div>

    ${isAdmin() ? `<div style="margin-top:30px;border-top:1px solid var(--line);padding-top:20px;text-align:center;">
      <button class="btn btn-outline" onclick="go('adminDashboard')">لوحة تحكم محمد نور</button>
    </div>` : `<div style="margin-top:30px;border-top:1px solid var(--line);padding-top:20px;text-align:center;">
      <div class="muted" style="font-size:13px;">لوحة تحكم لازم تكون محمد نور!!</div>
      <a onclick="go('adminLogin')" style="cursor:pointer;color:var(--navy);font-weight:700;">لوحة تحكم محمد نور</a>
    </div>`}
  </div>`;
}
function statCard(num,label){
  return `<div class="stat-card"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`;
}
function renderTableOnly(){
  let list = [...DB.requests];
  if(dashTab==='pending') list = list.filter(r=>r.status==='pending');
  if(dashTab==='rejected') list = list.filter(r=>r.status==='rejected');
  if(dashTab==='accepted') list = list.filter(r=>r.status==='accepted');
  if(dashSearch.trim()){
    const q = dashSearch.trim().toLowerCase();
    list = list.filter(r => r.name.toLowerCase().includes(q) || r.title.toLowerCase().includes(q) || r.phone.includes(q));
  }
  document.getElementById('tableHolder').innerHTML = renderRequestsTable(list);
}

function renderRequestsTable(list){
  if(list.length===0){
    return `<div class="empty"><div class="ico">📭</div>لا توجد طلبات في هذا القسم حاليًا.</div>`;
  }
  const rows = list.map((r,i)=>`

      <td>${fmtTimeOnly(r.createdAt)}</td>
      <td>${statusBadge(r.status)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openDetails('${r.id}')">تفاصيل</button></td>
    </tr>`).join('');
  const cards = list.map((r,i)=>`
    <div class="mrow">
      <div class="mline"><b>${esc(r.name)}</b>${statusBadge(r.status)}</div>
      <div class="mline">${esc(r.title)}</div>
      <div class="mline"><span>مجموعة ${esc(r.group)}</span><span>${esc(maskPhone(r.phone))}</span></div>

      <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%;" onclick="openDetails('${r.id}')">تفاصيل</button>
    </div>`).join('');
  return `
    <div class="table-wrap card" style="padding:0;overflow:auto;">
      <table>
        <thead><tr><th>#</th><th>الاسم</th><th>عنوان البحث</th><th>المجموعة</th><th>الهاتف</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="mobile-cards">${cards}</div>`;
}

/* ---------- تفاصيل الطلب + تعديل الحالة ---------- */
function openDetails(id){
  const req = DB.requests.find(r=>r.id===id);
  if(!req) return;
  const historyHtml = (req.history||[]).map(h=>`
    <div style="padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;">
      <b>${esc(h.action)}</b> — ${esc(h.by)}<br>
      <span class="muted">${fmtCairo(h.at)}</span>
      ${h.oldStatus||h.newStatus ? `<div class="muted">من: ${statusLabel(h.oldStatus)} → إلى: ${statusLabel(h.newStatus)}</div>`:''}
      ${h.note ? `<div class="muted">ملاحظة: ${esc(h.note)}</div>`:''}
    </div>`).join('') || '<div class="muted">لا يوجد سجل بعد.</div>';

  const actions = isLeader() ? `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
      ${req.status!=='accepted' ? `<button class="btn btn-navy btn-sm" onclick="changeStatusFlow('${req.id}','accepted')">قبول</button>`:''}
      ${req.status!=='rejected' ? `<button class="btn btn-red btn-sm" onclick="changeStatusFlow('${req.id}','rejected')">رفض</button>`:''}
      ${req.status==='rejected' ? `<button class="btn btn-navy btn-sm" onclick="changeStatusFlow('${req.id}','accepted')">تعديل الحالة → قبول</button>`:''}
      ${req.status==='accepted' ? `<button class="btn btn-red btn-sm" onclick="changeStatusFlow('${req.id}','rejected')">تعديل الحالة → رفض</button>`:''}
    </div>` : '';

  showModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 class="headline" style="margin:0;">تفاصيل الطلب</h3>
      ${statusBadge(req.status)}
    </div>
    <div style="line-height:2.1;font-size:14.5px;margin-top:12px;">
      <div><b>الاسم:</b> ${esc(req.name)}</div>
      <div><b>المجموعة:</b> ${esc(req.group)}</div>
      <div><b>الهاتف:</b> ${esc(isLeader()?req.phone:maskPhone(req.phone))}</div>
      <div><b>عنوان البحث:</b> ${esc(req.title)}</div>
      <div><b>وقت التسجيل:</b> ${fmtCairo(req.createdAt)}</div>
      ${req.rejectionReason ? `<div><b>سبب الرفض:</b> ${esc(req.rejectionReason)}</div>`:''}
    </div>
    ${actions}
    <h4 class="headline" style="margin-top:20px;">سجل التعديلات</h4>
    <div>${historyHtml}</div>
    <button class="btn btn-ghost" style="margin-top:14px;" onclick="closeModal()">إغلاق</button>
  `);
}
function statusLabel(s){ return s==='accepted'?'مقبول':s==='rejected'?'مرفوض':s==='pending'?'قيد المراجعة':'—'; }

function changeStatusFlow(id, newStatus){
  const req = DB.requests.find(r=>r.id===id);
  if(!req) return;
  if(newStatus==='accepted'){
    const conflict = DB.requests.find(r=> r.id!==id && r.phone===req.phone && (r.status==='pending'||r.status==='accepted'));
    if(conflict){ toast('لا يمكن القبول: يوجد طلب نشط آخر بنفس رقم الهاتف', 'error'); return; }
  }
  let note = '';
  if(newStatus==='rejected'){
    note = prompt('سبب الرفض (اختياري):','') || 'غير محدد';
  }
  if(!confirm(`هل أنت متأكد من تغيير حالة الطلب إلى "${statusLabel(newStatus)}"؟`)) return;
  setStatus(id, newStatus, currentActorName(), note);
  toast(newStatus==='accepted' ? 'تم قبول البحث' : 'تم رفض البحث', 'success');
  closeModal();
  render();
}
function currentActorName(){ return isAdmin() ? 'محمد نور' : 'الليدر'; }

/* ---------- Modal helpers ---------- */
function showModal(innerHtml){
  document.getElementById('modalHost').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">${innerHtml}</div>
    </div>`;
}
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }

/* ---------- صفحة فلترة الأبحاث المتشابهة ---------- */
function viewSimilarity(){
  if(!guardLeader()) return '';
  const pairs = runSimilarityAnalysis();
  const {groups, activePairs} = clusterSimilarPairs(pairs);
  const similarIds = new Set(groups.flat());
  const clearReqs = DB.requests.filter(r => r.status!=='rejected' && !similarIds.has(r.id));

  const groupCards = groups.map((groupIds, gi)=>{
    const items = groupIds.map(id=>DB.requests.find(r=>r.id===id)).filter(Boolean)
      .sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
    const rows = items.map((r,idx)=>{
      const others = items.filter(x=>x.id!==r.id);
      const pairInfo = others.map(o=>{
        const sc = titleSimilarity(r.title, o.title);
        return `${esc(o.name)} (${(sc*100).toFixed(0)}%)`;
      }).join('، ');
      return `
      <div style="padding:10px 0;border-bottom:1px dashed #EFC6C6;">
        <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">
          <b>${esc(r.name)}</b>
          ${idx===0?'<span class="badge badge-gray">الأسبق تسجيلاً</span>':''}
        </div>
        <div style="font-size:14px;margin:4px 0;">${esc(r.title)}</div>
        <div class="muted" style="font-size:12.5px;">مجموعة ${esc(r.group)} · ${esc(maskPhone(r.phone))} · ${fmtCairo(r.createdAt)}</div>
        <div class="muted" style="font-size:12.5px;margin-top:2px;">مشابه لـ: ${pairInfo}</div>
        <button class="btn btn-outline btn-sm" style="margin-top:8px;" onclick="markPairsNotSimilar('${r.id}', ${JSON.stringify(groupIds).replace(/"/g,'&quot;')})">لا، مش متشابه</button>
      </div>`;
    }).join('');
    return `<div class="sim-card similar" style="margin-bottom:16px;">
      <div class="badge badge-red" style="margin-bottom:8px;">تشابه محتمل — مجموعة ${gi+1}</div>
      ${rows}
    </div>`;
  }).join('') || `<div class="empty"><div class="ico">🎉</div>لا توجد أبحاث بها تشابه محتمل حاليًا.</div>`;

  const clearCards = clearReqs.map(r=>`
    <div class="sim-card clear" style="margin-bottom:10px;">
      <div class="badge badge-green" style="margin-bottom:6px;">لا يوجد تشابه واضح</div>
      <b>${esc(r.name)}</b> — ${esc(r.title)}
      <div class="muted" style="font-size:12.5px;margin-top:2px;">${fmtCairo(r.createdAt)}</div>
    </div>`).join('') || `<div class="empty">لا توجد طلبات لعرضها.</div>`;

  return `
  <div class="section">
    <a class="backlink" onclick="go('leaderDashboard')" style="cursor:pointer;">→ لوحة تحكم الليدر</a>
    <h2 class="headline" style="color:var(--navy);">فلترة الطلبات المتشابهة</h2>

    <div class="disclaimer-box" style="margin:14px 0 22px;">
      هذا تحليل تقديري محلي يعتمد على مقارنة الكلمات الأساسية والمفاهيم التخصصية في الجيوماتكس،
      وليس نموذج ذكاء اصطناعي دلالي فعلي (لم يتم ربط خدمة ذكاء اصطناعي بمفتاح API في هذه النسخة).
      اعتبر النتيجة اقتراحًا للمراجعة فقط، والقرار النهائي للّيدر.
    </div>

    <h3 class="headline">الأبحاث المحتمل تشابهها</h3>
    ${groupCards}

    <h3 class="headline" style="margin-top:26px;">الأبحاث غير المتشابهة</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">${clearCards}</div>

    <div style="text-align:center;margin:24px 0;">
      <button class="btn btn-outline" onclick="markSimilarityReviewed()">✅ تمت المراجعة</button>
      ${DB.similarityReviewedAt ? `<div class="muted" style="margin-top:8px;font-size:13px;">آخر مراجعة: ${fmtCairo(DB.similarityReviewedAt)} بواسطة ${esc(DB.similarityReviewedBy||'')}</div>`:''}
    </div>

    <div class="card" style="background:var(--off-white);">
      <h3 class="headline" style="margin-top:0;">القرارات الجماعية</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button class="btn btn-navy" onclick="bulkAcceptClear()">قبول الأبحاث التي ليست متشابهة</button>
        <button class="btn btn-red" onclick="bulkRejectDuplicates()">رفض البحث المتشابه مع زميله الذي سبقه في التسجيل</button>
      </div>
    </div>
  </div>`;
}

function markPairsNotSimilar(reqId, groupIds){
  groupIds.filter(id=>id!==reqId).forEach(otherId=>{
    const key = pairKey(reqId, otherId);
    DB.similarityDecisions[key] = { decision:'not_similar', by: currentActorName(), at: nowIso() };
  });
  saveDB(DB);
  toast('تم استبعاد هذا التشابه من النتائج', 'info');
  render();
}
function markSimilarityReviewed(){
  DB.similarityReviewedAt = nowIso();
  DB.similarityReviewedBy = currentActorName();
  saveDB(DB);
  toast('تم حفظ نتائج مراجعة التشابه', 'success');
  render();
}

function bulkAcceptClear(){
  const pairs = runSimilarityAnalysis();
  const {groups} = clusterSimilarPairs(pairs);
  const similarIds = new Set(groups.flat());
  const toAccept = DB.requests.filter(r=> r.status==='pending' && !similarIds.has(r.id));
  if(toAccept.length===0){ toast('لا توجد طلبات جاهزة للقبول الجماعي', 'warn'); return; }
  if(!confirm(`سيتم قبول ${toAccept.length} طلب/طلبات غير متشابهة. هل تريد المتابعة؟`)) return;
  toAccept.forEach(r=> setStatus(r.id, 'accepted', currentActorName(), 'قبول جماعي - غير متشابه'));
  toast(`تم قبول ${toAccept.length} طلب`, 'success');
  render();
}

function bulkRejectDuplicates(){
  const pairs = runSimilarityAnalysis();
  const {groups} = clusterSimilarPairs(pairs);
  const toReject = [];
  groups.forEach(groupIds=>{
    const items = groupIds.map(id=>DB.requests.find(r=>r.id===id)).filter(r=>r && r.status==='pending')
      .sort((a,b)=> new Date(a.createdAt)-new Date(b.createdAt));
    if(items.length<2) return;
    const earliest = items[0];
    items.slice(1).forEach(r=> toReject.push({req:r, keepName:earliest.name}));
  });
  if(toReject.length===0){ toast('لا توجد طلبات مكررة قابلة للرفض حاليًا', 'warn'); return; }
  const summary = toReject.map(x=>`• ${x.req.name} (أسبقية لـ ${x.keepName})`).join('\n');
  if(!confirm(`سيتم رفض الطلبات التالية بسبب التشابه مع بحث سابق:\n\n${summary}\n\nمتابعة؟`)) return;
  toReject.forEach(x=> setStatus(x.req.id, 'rejected', currentActorName(), `تشابه مع بحث سبق تسجيله لـ ${x.keepName}`));
  toast(`تم رفض ${toReject.length} طلب مكرر`, 'success');
  render();
}

/* ---------- لوحة تحكم محمد نور ---------- */
function viewAdminDashboard(){
  if(!guardAdmin()) return '';
  return `
  <div class="section">
    <a class="backlink" onclick="go('leaderDashboard')" style="cursor:pointer;">→ لوحة تحكم الليدر</a>
    <h2 class="headline" style="color:var(--navy);">لوحة تحكم محمد نور</h2>
    <p class="muted">تشمل كل صلاحيات الليدر بالإضافة إلى إعادة ضبط الموقع.</p>

    <div class="card" style="border:1.5px solid var(--red);background:var(--red-bg);margin-top:20px;">
      <h3 class="headline" style="margin-top:0;color:var(--red);">إعادة ضبط الموقع</h3>
      <p style="font-size:14.5px;">تسمح لك هذه الخاصية بمسح جميع الطلبات المسجلة وإعادة استخدام الموقع لمادة دراسية جديدة.</p>
      <button class="btn btn-red" onclick="openResetModal()">مسح جميع الطلبات</button>
    </div>

    <div class="card" style="margin-top:20px;">
      <h3 class="headline" style="margin-top:0;">سجل عمليات إعادة الضبط</h3>
      ${DB.resetLog.length ? DB.resetLog.map(l=>`<div class="muted" style="font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);">${fmtCairo(l.at)} — نفّذها ${esc(l.by)} — عدد الطلبات المحذوفة: ${l.count}</div>`).join('') : '<div class="muted">لا يوجد سجل بعد.</div>'}
    </div>
  </div>`;
}
function openResetModal(){
  showModal(`
    <h3 class="headline" style="color:var(--red);margin-top:0;">تأكيد إعادة ضبط الموقع</h3>
    <div class="disclaimer-box" style="background:var(--red-bg);border-color:#EFC6C6;color:var(--red);">
      تحذير: سيتم حذف جميع الطلبات المسجلة، بما في ذلك الطلبات المقبولة والمرفوضة والطلبات قيد المراجعة،
      وسجلات المراجعة المرتبطة بها. لا يمكن التراجع عن هذه العملية.
    </div>
    <div class="field" style="margin-top:14px;">
      <label>لتأكيد العملية، اكتب كلمة "تأكيد" أدناه</label>
      <input type="text" id="in_resetConfirm" placeholder="تأكيد">
    </div>
    <div class="field">
      <label>أعد إدخال كلمة المرور</label>
      <input type="password" id="in_resetPass">
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-red" onclick="doReset()">تنفيذ المسح</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function doReset(){
  const word = document.getElementById('in_resetConfirm').value.trim();
  const pass = document.getElementById('in_resetPass').value;
  if(word!=='تأكيد' || pass!==ADMIN_AUTH.password){
    toast('تأكيد غير صحيح، تحقق من الكلمة وكلمة المرور', 'error');
    return;
  }
  const count = DB.requests.length;
  DB.resetLog.push({at: nowIso(), by:'محمد نور', count});
  DB.requests = [];
  DB.similarityDecisions = {};
  DB.reviewLog = [];
  DB.similarityReviewedAt = null;
  DB.similarityReviewedBy = null;
  saveDB(DB);
  closeModal();
  toast('تمت إعادة ضبط الموقع بنجاح، ويمكنك الآن استخدامه لمادة دراسية جديدة.', 'success');
  render();
}

/* ---------- الموجّه الرئيسي للعرض ---------- */
function render(){
  renderNavActions();
  const app = document.getElementById('app');
  let html = '';
  switch(VIEW){
    case 'home': html = viewHome(); break;
    case 'newRequest': html = viewNewRequest(); break;
    case 'success': html = viewSuccess(); break;
    case 'track': html = viewTrack(); break;
    case 'leaderLogin': html = viewLeaderLogin(); break;
    case 'adminLogin': html = viewAdminLogin(); break;
    case 'leaderDashboard': html = viewLeaderDashboard(); break;
    case 'similarityView': html = viewSimilarity(); break;
    case 'adminDashboard': html = viewAdminDashboard(); break;
    default: html = viewHome();
  }
  app.innerHTML = html;
}

render();
</script>
